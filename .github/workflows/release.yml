name: Release npm package

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        required: true
        default: major
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: npm-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require a major release for the Angular support change
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          node -e "if (require('./package.json').version.startsWith('2.') && process.env.RELEASE_TYPE !== 'major') { throw new Error('Dropping Angular 18/19 requires the v3 major release.'); }"
      - name: Verify before changing version or tags
        run: npm run verify:release
      - name: Inspect package before release mutation
        run: npm pack ./dist/drag-drop-layout --dry-run
      - name: Configure Git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
      - name: Version and changelog
        run: |
          npm run release -- --release-as "${{ inputs.release-type }}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
      - name: Rebuild versioned package
        run: npm run build:lib
      - name: Push release commit and tag
        run: git push --follow-tags origin HEAD:master
      - name: Publish to npm
        working-directory: dist/drag-drop-layout
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          generate_release_notes: true
