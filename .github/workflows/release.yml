name: Release npm package

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        required: true
        default: major
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency: npm-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: Check trusted publishing runtime
        run: |
          node --version
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          node - "$NPM_VERSION" <<'NODE'
          const version = process.argv[2];
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
          const [major, minor, patch] = match ? match.slice(1).map(Number) : [];
          if (!match || major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error('npm ' + version + ' does not meet the trusted publishing requirement: use stable npm >=11.5.1.');
          }
          NODE
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require a major release for the Angular support change
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          node -e "if (require('./package.json').version.startsWith('2.') && process.env.RELEASE_TYPE !== 'major') { throw new Error('Dropping Angular 18/19 requires the v3 major release.'); }"
      - name: Verify before changing version or tags
        run: npm run verify:release
      - name: Inspect package before release mutation
        run: npm pack ./dist/drag-drop-layout --dry-run
      - name: Configure Git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
      - name: Version and changelog
        run: |
          npm run release -- --release-as "${{ inputs.release-type }}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
      - name: Rebuild versioned package
        run: npm run build:lib
      - name: Push release commit and tag
        run: git push --follow-tags origin HEAD:master
      - name: Publish to npm
        working-directory: dist/drag-drop-layout
        run: npm publish --access public
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          generate_release_notes: true
